# ============================================================
#  UBMS — Nginx Virtual Host Configuration
#  GoManilaHost VPS  |  gomanilahost.net
#
#  Place this file at:
#    /etc/nginx/sites-available/ubms
#  Enable with:
#    sudo ln -s /etc/nginx/sites-available/ubms /etc/nginx/sites-enabled/ubms
#    sudo nginx -t && sudo systemctl reload nginx
#
#  SSL (Let's Encrypt):
#    sudo certbot --nginx -d dheekaybuilders.com -d www.dheekaybuilders.com
#    sudo certbot --nginx -d kdchavitconstruction.com -d www.kdchavitconstruction.com
# ============================================================

upstream ubms_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─────────────────────────────────────────────────────────────
#  dheekaybuilders.com  →  HTTP  (redirect to HTTPS)
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dheekaybuilders.com www.dheekaybuilders.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://dheekaybuilders.com$request_uri; }
}

# ─────────────────────────────────────────────────────────────
#  dheekaybuilders.com  →  HTTPS
# ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dheekaybuilders.com www.dheekaybuilders.com;

    ssl_certificate     /etc/letsencrypt/live/dheekaybuilders.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dheekaybuilders.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Redirect www → non-www
    if ($host = www.dheekaybuilders.com) {
        return 301 https://dheekaybuilders.com$request_uri;
    }

    # Redirect bare domain root to /system/
    location = / { return 302 /system/; }

    location / {
        proxy_pass         http://ubms_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50m;
    }
}

